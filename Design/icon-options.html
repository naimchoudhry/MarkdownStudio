<!doctype html><html><head><meta charset="utf-8"><title>Icon Options</title>
<style>
:root { --bg:#F4F2EC; --text:#2B2A27; --muted:#6B675F; --card:#FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --bg:#1C1B19; --text:#EDE9E0; --muted:#A39E93; --card:#272623; } }
body { margin:0; padding:32px 16px; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, sans-serif; }
h1 { text-align:center; font-weight:600; margin:0 0 4px; }
p.lead { text-align:center; color:var(--muted); margin:0 0 28px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; max-width:1000px; margin:0 auto; }
figure { margin:0; background:var(--card); border-radius:18px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.big svg { width:200px; height:200px; display:block; }
.sizes { display:flex; align-items:flex-end; gap:14px; }
.sizes svg { width:100%; display:block; }
figcaption { text-align:center; display:flex; flex-direction:column; gap:2px; }
figcaption span { color:var(--muted); font-size:13px; }
</style></head><body>
